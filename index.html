<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наше свидание ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ПЕРВЫЙ ЭКРАН -->

    <div class="card" id="invite-screen">

        <div class="heart">❤️</div>

        <h1>Дорогая женушка</h1>

        <p>Сегодня вечером смотрим фильм? 🎬🍿</p>

        <button id="yes-button">
            ДА ❤️
        </button>

        <button id="no-button">
            НЕТ
        </button>

    </div>


    <!-- ВЫБОР ФИЛЬМА -->

    <div class="card hidden" id="movie-screen">

        <div class="heart">🎬</div>

        <h1>Что будем смотреть?</h1>

        <p>Выбирай, женушка ❤️</p>

        <button class="movie-button" data-movie="Гарри Поттер">
            🪄 Гарри Поттер
        </button>

        <button class="movie-button" data-movie="Интерстеллар">
            🚀 Интерстеллар
        </button>

        <button class="movie-button" data-movie="Комедия">
            😂 Комедия
        </button>

        <button class="movie-button" data-movie="Романтический фильм">
            💕 Романтический фильм
        </button>

        <button id="custom-button">
            ✍️ Твой вариант
        </button>

        <button id="continue-button" class="hidden">
            Продолжить ❤️
        </button>

    </div>


    <!-- ВЫБОР ВРЕМЕНИ -->

    <div class="card hidden" id="time-screen">

        <div class="heart">🕐</div>

        <h1>А теперь время</h1>

        <p id="selected-movie"></p>

        <button class="time-button" data-time="22:00">
            22:00
        </button>

        <button class="time-button" data-time="23:00">
            23:00
        </button>

        <button class="time-button" data-time="00:00">
            00:00
        </button>

    </div>


    <!-- ФИНАЛЬНЫЙ ЭКРАН -->

    <div class="card hidden" id="final-screen">

        <div class="heart">💕</div>

        <h1>Наше свидание ❤️</h1>

        <p id="final-movie"></p>

        <p id="final-time"></p>

        <p>
            Всё решено! 🥰<br>
            Жду тебя, любимая ❤️
        </p>

        <div class="heart">
            🍿🎬❤️
        </div>

    </div>


    <!-- FIREBASE + ЛОГИКА САЙТА -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        // FIREBASE

        const firebaseConfig = {

            apiKey: "AIzaSyChKIpsHQ3GPUNqnj3rSw3e3IBnae0AguE",

            authDomain: "class-c8153.firebaseapp.com",

            projectId: "class-c8153",

            storageBucket: "class-c8153.firebasestorage.app",

            messagingSenderId: "852154048871",

            appId: "1:852154048871:web:3d82e95bd832c94fdb4fc2",

            measurementId: "G-ZHN6706H14"

        };


        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        // ВЫБРАННЫЙ ФИЛЬМ

        let selectedMovie = "";


        // КНОПКА ДА

        document
            .getElementById("yes-button")
            .addEventListener("click", function() {

                document
                    .getElementById("invite-screen")
                    .classList.add("hidden");

                document
                    .getElementById("movie-screen")
                    .classList.remove("hidden");

            });


        // КНОПКА НЕТ

        document
            .getElementById("no-button")
            .addEventListener("click", function() {

                alert(
                    "Извини, женушка ❤️\n" +
                    "Это не входит в наши планы 😂"
                );

            });


        // ВЫБОР ФИЛЬМА

        document
            .querySelectorAll(".movie-button")
            .forEach(function(button) {

                button.addEventListener("click", function() {

                    selectedMovie = this.dataset.movie;


                    document
                        .querySelectorAll(".movie-button")
                        .forEach(function(item) {

                            item.classList.remove("selected");

                        });


                    this.classList.add("selected");


                    document
                        .getElementById("continue-button")
                        .classList.remove("hidden");

                });

            });


        // ТВОЙ ВАРИАНТ

        document
            .getElementById("custom-button")
            .addEventListener("click", function() {

                let movie = prompt(
                    "Какой фильм хочешь посмотреть? ❤️"
                );


                if (movie && movie.trim() !== "") {

                    selectedMovie = movie.trim();


                    document
                        .querySelectorAll(".movie-button")
                        .forEach(function(item) {

                            item.classList.remove("selected");

                        });


                    document
                        .getElementById("continue-button")
                        .classList.remove("hidden");

                }

            });


        // ПРОДОЛЖИТЬ

        document
            .getElementById("continue-button")
            .addEventListener("click", function() {

                document
                    .getElementById("movie-screen")
                    .classList.add("hidden");

                document
                    .getElementById("time-screen")
                    .classList.remove("hidden");


                document
                    .getElementById("selected-movie")
                    .textContent =
                    "Вы выбрали: " +
                    selectedMovie +
                    " ❤️";

            });


        // ВЫБОР ВРЕМЕНИ

        document
            .querySelectorAll(".time-button")
            .forEach(function(button) {

                button.addEventListener("click", async function() {

                    let selectedTime = this.dataset.time;


                    // СОХРАНЯЕМ В FIRESTORE

                    try {

                        await addDoc(
                            collection(db, "dateChoices"),
                            {

                                movie: selectedMovie,

                                time: selectedTime,

                                createdAt: serverTimestamp()

                            }
                        );


                        // ПЕРЕХОД НА ФИНАЛ

                        document
                            .getElementById("time-screen")
                            .classList.add("hidden");

                        document
                            .getElementById("final-screen")
                            .classList.remove("hidden");


                        document
                            .getElementById("final-movie")
                            .textContent =
                            "🎬 Фильм: " +
                            selectedMovie;


                        document
                            .getElementById("final-time")
                            .textContent =
                            "🕐 Время: " +
                            selectedTime;


                        startHearts();

                    }


                    catch (error) {

                        console.error(
                            "Ошибка сохранения:",
                            error
                        );


                        alert(
                            "Ой 😅 Не получилось сохранить выбор. " +
                            "Проверь интернет-соединение."
                        );

                    }

                });

            });


        // СОЗДАНИЕ СЕРДЕЧКА

        function createHeart() {

            let heart =
                document.createElement("div");

            heart.className =
                "floating-heart";

            heart.textContent =
                "❤️";


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.fontSize =
                (20 + Math.random() * 30) + "px";


            heart.style.animationDuration =
                (3 + Math.random() * 3) + "s";


            document.body.appendChild(
                heart
            );


            setTimeout(function() {

                heart.remove();

            }, 6000);

        }


        // ЗАПУСК СЕРДЕЧЕК

        function startHearts() {

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                setTimeout(function() {

                    createHeart();

                }, i * 180);

            }

        }

    </script>

</body>

</html>
